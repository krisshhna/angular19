<mat-card>
    <mat-card-content>
        <button type="button" mat-button color="warn" routerLink="/hotel/hotel-add">+ Hotel</button>
    </mat-card-content>
</mat-card>
<br>
<mat-card>
    <mat-card-content>
        <div class="row">
            <mat-form-field>
                <mat-label>Page</mat-label>
                <mat-select [(value)]="pageValue" (selectionChange)="applyFilter()">
                    <mat-option *ngFor="let pg of pages" [value]="pg">{{pg}}</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field>
                <mat-label>Location</mat-label>
                <mat-select [(value)]="locationValue" (selectionChange)="applyFilter()">
                    <mat-option *ngFor="let lc of location" [value]="lc._id">{{lc.name}}</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field>
                <mat-label>Status</mat-label>
                <mat-select [(value)]="statusValue" (selectionChange)="applyFilter()">
                    <mat-option value="active">Active</mat-option>
                    <mat-option value="Inactive">In active</mat-option>
                </mat-select>
            </mat-form-field>

            <mat-form-field>
                <mat-label>Search</mat-label>
                <input type="text" matInput [(ngModel)]="searchValue" (input)="searchFilter($any($event.target).value)">
            </mat-form-field>
        </div>

        <div class="container">
            <h2>User Management</h2>
            <!-- <mat-form-field appearance="outline">
                <mat-label>Search User</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Search records">
            </mat-form-field> -->

            <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

                <ng-container matColumnDef="_id">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>
                        ID
                    </th>

                    <td mat-cell *matCellDef="let row; let i = index">
                        {{i + 1}}
                    </td>
                </ng-container>

                <!-- Name -->
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>
                        Name
                    </th>

                    <td mat-cell *matCellDef="let row">
                        {{row.name}}
                    </td>
                </ng-container>

                <!-- Status -->

                <!-- Edit -->
                <ng-container matColumnDef="edit">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>
                        Edit
                    </th>

                    <td mat-cell *matCellDef="let row">
                       <button type="button" mat-button color="default">Edit</button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns; let i=index"></tr>
            </table>

            <mat-paginator
                [pageSize]="5"
                [pageSizeOptions]="[5, 10, 20]"
                showFirstLastButtons>
            </mat-paginator>
        </div>
    </mat-card-content>
</mat-card>
