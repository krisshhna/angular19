<mat-toolbar color="default">
    <button type="button" mat-button color="default" (click)="drawer.toggle()">=</button>
</mat-toolbar>

<mat-drawer-container>
    <mat-drawer #drawer opened="true" mode="side">
        <div>
            <button type="button" mat-button routerLink="/hotel/hotel-list">HOTEL</button> <br/>
            <button type="button" mat-button >LOGOUT</button>
        </div>
    </mat-drawer>

    <mat-drawer-content>
        <div style="min-height:800px; padding:20px;">
            <router-outlet></router-outlet>
        </div>
    </mat-drawer-content>
</mat-drawer-container>
